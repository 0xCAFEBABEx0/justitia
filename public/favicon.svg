<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three lines of a diff: unchanged, deleted and added, in the site's diff colors.
       favicon.ico, apple-touch-icon.png (corners left square: iOS rounds them) and og-image.png are
       rendered from this drawing. -->
  <rect width="32" height="32" rx="7" fill="#1f4e8c"/>
  <rect x="6" y="7" width="20" height="4" rx="2" fill="#fff" opacity=".6"/>
  <rect x="6" y="14" width="14" height="4" rx="2" fill="#f2aaa3"/>
  <rect x="6" y="21" width="20" height="4" rx="2" fill="#9be0ad"/>
</svg>
