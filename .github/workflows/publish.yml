# Publishes the site to Cloudflare: the data the pages fetch in the browser to R2
# (https://data.anisotro.pics), then the site to Workers static assets (https://anisotro.pics).
# See README, "Publishing", for the one-time Cloudflare setup and secrets.
#
# Only what changed is rebuilt. The extracted data is cached under a key made of the houritsu
# commits and the extractor's code: when neither changed (a change to the site, or a day without
# new commits in houritsu) and R2 still holds that data, the cached data is used and nothing is
# extracted or uploaded. The search index is rebuilt only when the law text on the built pages (or
# the indexer) changed. A change to the site alone takes a few minutes; new commits in houritsu
# take about 30.
name: Publish

on:
  schedule:
    - cron: "30 21 * * *" # 06:30 JST every day
  push:
    branches: [main]
    paths-ignore: ["**/*.md", ".coderabbit.yaml", ".github/dependabot.yml", ".github/rulesets/**"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Extract the data and build the search index even if their inputs did not change
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_DATA_BASE: https://data.anisotro.pics
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (see README, Publishing)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7

      # Ubuntu's rclone (1.60) gets "501 NotImplemented" from R2 on some uploads; use a current release.
      # (Not RCLONE_VERSION: rclone reads every RCLONE_* variable as a flag, and that one is --version.)
      - name: Install rclone
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" "https://downloads.rclone.org/v${RELEASE}/rclone-v${RELEASE}-linux-amd64.zip"
          unzip -q -j "$RUNNER_TEMP/rclone.zip" "*/rclone" -d "$RUNNER_TEMP/rclone"
          sudo install "$RUNNER_TEMP/rclone/rclone" /usr/local/bin/rclone
          rclone version
        env:
          RELEASE: 1.68.2

      # Fail in seconds, not after the 30-minute build, when a key is wrong or R2 rejects rclone's requests.
      - name: Check R2 and the Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          scripts/upload-data.sh --check
          # An account API token is verified under the account, a user API token under /user.
          for url in "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"; do
            if curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" 2>/dev/null | grep -Eq '"status": ?"active"'; then
              echo "CLOUDFLARE_API_TOKEN is active"; exit 0
            fi
          done
          echo "::error::CLOUDFLARE_API_TOKEN is not an active API token for this account (see README, Publishing)"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Fetch houritsu
        id: houritsu
        run: |
          npm run fetch-houritsu
          main=$(git -C houritsu rev-parse origin/main)
          upcoming=$(git -C houritsu rev-parse --verify -q origin/upcoming || echo none)
          echo "commits=$main-$upcoming" >>"$GITHUB_OUTPUT"

      # What the site build reads from the extracted data (about 100 MB). amendments/ and history/
      # are only fetched by the browser, from R2, so a cache hit needs neither.
      - name: Restore the extracted data
        id: data
        uses: actions/cache/restore@v5
        with:
          path: |
            data/meta.json
            data/laws.json
            data/laws
            data/timeline
          key: data-${{ steps.houritsu.outputs.commits }}-${{ hashFiles('scripts/extract/**', '!scripts/extract/**/*.test.ts', 'package-lock.json') }}
          lookup-only: ${{ inputs.rebuild == true }}

      # A cache entry is used only while R2 holds the same data (_publish/data-version.txt, written by
      # the upload). They can differ: after an extractor change is published and then reverted, the
      # older cache entry matches again, but R2 has the newer extractor's data.
      - name: Check the published data
        id: published
        if: steps.data.outputs.cache-hit == 'true' && inputs.rebuild != true
        run: |
          cached=$(node -p 'require("./data/meta.json").dataVersion')
          published=$(curl -fsS "$PUBLIC_DATA_BASE/_publish/data-version.txt?ts=$(date +%s%N)" || echo none)
          if [[ "$published" == "$cached" ]]; then
            echo "R2 holds the cached data ($cached)"
            echo "same=true" >>"$GITHUB_OUTPUT"
          else
            echo "R2 holds $published, the cache $cached: extracting again"
          fi

      - name: Extract data (about 15 minutes)
        id: extract
        if: steps.published.outputs.same != 'true'
        run: npm run extract
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build the site
        run: npm run build

      # Skipped (in a few seconds) when the published index was built from the same input.
      - name: Build the search index (about 10 minutes when it changed)
        run: |
          if [[ "$REBUILD" == true ]]; then
            npm run search-index
          else
            npm run search-index -- --skip-if-same "$PUBLIC_DATA_BASE/pagefind/shards.json"
          fi
        env:
          REBUILD: ${{ inputs.rebuild == true }}

      - name: Upload data to R2
        run: |
          parts=()
          if [[ "$EXTRACTED" == success ]]; then parts+=(data); fi
          if [[ -f data/pagefind/shards.json ]]; then parts+=(pagefind); fi
          if ((${#parts[@]})); then
            scripts/upload-data.sh "${parts[@]}"
          else
            echo "Nothing to upload: the data and the search index are unchanged"
          fi
        env:
          EXTRACTED: ${{ steps.extract.outcome }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Saved only once the data is in R2, so a run that fails before the upload leaves no cache entry.
      - name: Save the extracted data
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            data/meta.json
            data/laws.json
            data/laws
            data/timeline
          key: ${{ steps.data.outputs.cache-primary-key }}

      - name: Deploy the site
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
