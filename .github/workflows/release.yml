# Creates the GitHub Release (and its tag v<version>) for the newest version in CHANGELOG.md when a release PR
# merges into main. See README, "Versioning and releases".
#
# The site is deployed by the Publish workflow on every push to main; a release does not deploy anything. A release
# PR changes only CHANGELOG.md, which Publish ignores, so the tag points at the commit whose site is already live.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  # Creates the release of the newest version if it is missing (after a failed run, for example), at main's head.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v7

      # scripts/changelog.ts uses only Node.js built-ins (TypeScript runs directly from 22.18), so no npm ci.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check CHANGELOG.md and write the release notes
        id: changelog
        run: |
          version=$(node scripts/changelog.ts --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # gh is preinstalled on GitHub-hosted runners. A tag that does not exist yet is created at --target.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do"
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
