# Dependabot version updates.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # npm dependencies (Astro site and extraction scripts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    # Wait a few days after a release before proposing it, so broken or
    # malicious releases have time to be pulled.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
      include: scope

  # Actions used in .github/workflows. There are no workflows yet; this starts
  # working once the deploy workflow is added.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
