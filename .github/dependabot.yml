# Dependabot version updates.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # npm dependencies (Astro site and extraction scripts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    # Wait a few days after a release before proposing it, so broken or
    # malicious releases have time to be pulled.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
      include: scope

  # Actions used in .github/workflows. There are no workflows yet; this starts
  # working once the deploy workflow is added.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The Cloudflare provider in infra/terraform (the prod root and the module).
  # .terraform.lock.hcl is not committed, so a PR only moves the version
  # constraint and no CI job runs Terraform: after merging, the owner runs
  # `terraform init -upgrade` and `plan` (infra/README.md) before any apply.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/prod
      - /infra/terraform/modules/cloudflare_site
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns:
          - "*"
    commit-message:
      prefix: "infra"
